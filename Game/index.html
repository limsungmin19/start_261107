<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131f">
  <title>Neon Blocks | 테트리스</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Neon Blocks 홈">
        <span class="brand-mark" aria-hidden="true">▦</span>
        <span>NEON<span class="brand-accent">BLOCKS</span></span>
      </a>
      <span class="topbar-label">CLASSIC ARCADE</span>
    </header>

    <section class="game-layout" aria-label="테트리스 게임">
      <aside class="side-panel left-panel">
        <div class="eyebrow">YOUR PROGRESS</div>
        <h1>블록을 쌓고<br><span>라인을 지우세요</span></h1>
        <div class="stat-card">
          <div class="stat-label">점수 <span>SCORE</span></div>
          <strong id="score">000000</strong>
        </div>
        <div class="stat-row">
          <div class="stat-card compact">
            <div class="stat-label">레벨</div>
            <strong id="level">01</strong>
          </div>
          <div class="stat-card compact">
            <div class="stat-label">라인</div>
            <strong id="lines">00</strong>
          </div>
        </div>
        <div class="best-score">최고 점수 <strong id="best-score">000000</strong></div>
      </aside>

      <div class="board-wrap">
        <div class="board-frame">
          <canvas id="game-board" width="300" height="600" aria-label="테트리스 게임 보드"></canvas>
          <div class="overlay" id="overlay">
            <div class="overlay-card">
              <span class="overlay-icon" id="overlay-icon">▦</span>
              <h2 id="overlay-title">준비되셨나요?</h2>
              <p id="overlay-message">플레이 버튼을 눌러 게임을 시작하세요.</p>
              <button class="primary-button" id="overlay-button">게임 시작</button>
            </div>
          </div>
        </div>
        <div class="board-footer">
          <span><i class="live-dot"></i> <span id="game-status">READY TO PLAY</span></span>
          <span>10 × 20 GRID</span>
        </div>
      </div>

      <aside class="side-panel right-panel">
        <div class="preview-card">
          <div class="panel-heading">다음 블록 <span>NEXT</span></div>
          <canvas id="next-piece" width="120" height="100" aria-label="다음 블록 미리보기"></canvas>
        </div>
        <div class="controls-card">
          <div class="panel-heading">조작 방법 <span>CONTROLS</span></div>
          <div class="control-line"><span>이동</span><span class="key-group"><kbd>←</kbd><kbd>→</kbd></span></div>
          <div class="control-line"><span>회전</span><kbd>↑</kbd></div>
          <div class="control-line"><span>빠르게 내리기</span><kbd>↓</kbd></div>
          <div class="control-line"><span>한 번에 내리기</span><kbd>SPACE</kbd></div>
          <div class="control-line"><span>일시정지</span><kbd>P</kbd></div>
        </div>
        <button class="secondary-button" id="pause-button" disabled>Ⅱ <span>일시정지</span></button>
        <button class="secondary-button restart-button" id="restart-button">↻ <span>다시 시작</span></button>
      </aside>
    </section>

    <section class="touch-controls" aria-label="터치 조작">
      <button data-action="left" aria-label="왼쪽 이동">←</button>
      <button data-action="rotate" aria-label="회전">↻</button>
      <button data-action="down" aria-label="아래 이동">↓</button>
      <button data-action="right" aria-label="오른쪽 이동">→</button>
      <button data-action="drop" aria-label="한 번에 내리기">⇊</button>
    </section>
    <footer class="page-footer">한 줄씩 지우며 최고 점수에 도전해 보세요 <span>✦</span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
